[package]
name = "butterfly-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
butterfly-macros = { path = "../macros" }
dotenv = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
